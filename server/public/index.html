<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Generator</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Video Generator</h1>
    <button id="btn-new-project" class="btn btn-primary">+ Thêm dự án</button>
  </header>

  <main>
    <div id="empty-state" class="empty-state hidden">
      Chưa có dự án nào. Bấm "+ Thêm dự án" để bắt đầu.
    </div>
    <div id="project-grid" class="project-grid"></div>
  </main>

  <div id="batch-bar" class="batch-bar hidden">
    <span id="batch-count">Đã chọn 0</span>
    <label>
      <input type="radio" name="batch-mode" value="sequential" checked />
      Nối tiếp
    </label>
    <label>
      <input type="radio" name="batch-mode" value="parallel" />
      Song song
    </label>
    <label id="batch-concurrency-wrap" class="hidden">
      Số luồng:
      <input type="number" id="batch-concurrency" min="1" max="8" value="2" />
    </label>
    <button id="btn-batch-run" class="btn btn-primary">Chạy hàng loạt</button>
    <button id="btn-batch-clear" class="btn btn-ghost">Bỏ chọn</button>
  </div>

  <!-- New project modal -->
  <div id="modal-new" class="modal-overlay hidden">
    <div class="modal">
      <h2>Dự án mới</h2>
      <label class="field">
        Tên dự án
        <input type="text" id="new-project-name" placeholder="VD: Tai nghe Bluetooth ABC" />
      </label>
      <p class="hint-text">Ảnh sản phẩm được thêm sau, ở trang chi tiết dự án.</p>
      <div id="new-project-error" class="form-error hidden"></div>
      <div class="modal-actions">
        <button id="btn-new-project-cancel" class="btn btn-ghost">Huỷ</button>
        <button id="btn-new-project-submit" class="btn btn-primary">Tạo dự án</button>
      </div>
    </div>
  </div>

  <!-- Project detail modal -->
  <div id="modal-detail" class="modal-overlay hidden">
    <div class="modal modal-large">
      <div class="modal-header">
        <h2 id="detail-title">Dự án</h2>
        <div class="modal-header-actions">
          <button id="btn-detail-delete" class="btn btn-danger-ghost">Xoá dự án</button>
          <button id="btn-detail-close" class="btn btn-ghost">Đóng</button>
        </div>
      </div>

      <div id="detail-error-banner" class="error-banner hidden"></div>

      <div id="run-progress" class="stage-progress hidden">
        <span class="spinner"></span>
        <span id="run-stage-label"></span>
      </div>

      <section class="detail-section">
        <h3>Ảnh sản phẩm</h3>
        <div id="detail-images-grid" class="images-grid"></div>
        <p id="detail-image-count" class="hint-text"></p>
        <div class="button-row">
          <input type="file" id="detail-images-input" accept="image/*" multiple />
          <button id="btn-upload-images" class="btn btn-secondary">Tải ảnh lên</button>
        </div>
      </section>

      <section class="detail-section">
        <h3>Bối cảnh &amp; Hook (3 giây đầu)</h3>
        <p id="brief-gate-hint" class="hint-text hidden">Cần đủ ảnh đã xử lý trước khi dùng phần này.</p>
        <label class="field">
          Bối cảnh
          <textarea id="detail-context" rows="3" placeholder="VD: Một bạn trẻ đi làm văn phòng, hay quên đồ..."></textarea>
        </label>
        <label class="field">
          Hook 3 giây đầu
          <textarea id="detail-hook" rows="2" placeholder="VD: Câu đùa hoặc tình huống mở đầu gây chú ý"></textarea>
        </label>
        <div class="button-row">
          <button id="btn-suggest-brief" class="btn btn-secondary">Gợi ý từ ảnh</button>
          <button id="btn-save-brief" class="btn btn-secondary">Lưu</button>
        </div>
      </section>

      <section class="detail-section">
        <h3>Kịch bản</h3>
        <div class="button-row">
          <button id="btn-generate-storyboard" class="btn btn-secondary">Tạo kịch bản</button>
        </div>
        <div id="storyboard-current" class="storyboard-current"></div>
        <div id="storyboard-versions" class="storyboard-versions"></div>
      </section>

      <section class="detail-section">
        <h3>Video</h3>
        <div id="video-status"></div>
        <div class="button-row">
          <button id="btn-generate-video" class="btn btn-primary hidden">Tạo video</button>
          <button id="btn-view-video" class="btn btn-secondary hidden">Xem video</button>
          <button id="btn-regenerate-video" class="btn btn-secondary hidden">Tạo lại video</button>
        </div>
        <div id="progress-wrap" class="progress-wrap hidden">
          <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
          <span id="progress-label"></span>
        </div>
      </section>
    </div>
  </div>

  <!-- Video player modal -->
  <div id="modal-video" class="modal-overlay hidden">
    <div class="modal modal-video">
      <div class="modal-header">
        <h2>Xem video</h2>
        <button id="btn-video-close" class="btn btn-ghost">Đóng</button>
      </div>
      <video id="video-player" controls></video>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="/app.js"></script>
</body>
</html>
